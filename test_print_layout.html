<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Print Layout</title>
    <style>
        @media print {
            @page {
                size: A4 landscape;
                margin: 5mm;
            }
            
            body {
                font-family: Arial, Helvetica, sans-serif;
                font-size: 0.75vw;
                line-height: 1.0;
                margin: 0;
                padding: 0;
                width: 100vw;
                height: 100vh;
                background: white;
                color: #000;
                overflow: visible;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .container {
                width: 100%;
                max-width: calc(100vw - 10mm);
                margin: 0;
                padding: 0;
                transform: scale(0.92);
                transform-origin: center center;
            }
            
            table {
                width: 100%;
                border-collapse: collapse;
                table-layout: fixed;
                font-size: 0.7vw;
            }
            
            th, td {
                border: 0.1vh solid #000;
                padding: 0.2vh 0.3vw;
                text-align: center;
                vertical-align: middle;
            }
            
            th {
                background-color: #f5f5f5;
                font-weight: bold;
            }
        }
        
        @media screen {
            body {
                background: #f8f9fa;
                padding: 20px;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .container {
                background: white;
                box-shadow: 0 4px 20px rgba(0,0,0,0.1);
                border-radius: 8px;
                padding: 20px;
                transform: scale(0.85);
                transform-origin: center center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Print Layout</h1>
        <table>
            <thead>
                <tr>
                    <th>Subject</th>
                    <th>DS1</th>
                    <th>DS2</th>
                    <th>Exam</th>
                    <th>Average</th>
                    <th>Coeff</th>
                    <th>Total</th>
                    <th>Remarks</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Mathematics</td>
                    <td>15</td>
                    <td>14</td>
                    <td>16</td>
                    <td>15.00</td>
                    <td>4</td>
                    <td>60.00</td>
                    <td>Good work</td>
                </tr>
                <tr>
                    <td>Physics</td>
                    <td>12</td>
                    <td>13</td>
                    <td>14</td>
                    <td>13.00</td>
                    <td>3</td>
                    <td>39.00</td>
                    <td>Keep improving</td>
                </tr>
                <tr>
                    <td>Chemistry</td>
                    <td>16</td>
                    <td>15</td>
                    <td>17</td>
                    <td>16.00</td>
                    <td>3</td>
                    <td>48.00</td>
                    <td>Excellent</td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <script>
        // Test print functionality
        window.onload = function() {
            console.log("Test print layout loaded");
        };
    </script>
</body>
</html>
